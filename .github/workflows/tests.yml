name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes an in flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The three versions pyproject.toml claims to support.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Playwright is a core dependency because chainlink_recorder.public_delayed
      # imports it at module level. No test launches a browser, so the Chromium
      # binary is deliberately not downloaded here.
      - name: Install
        run: python -m pip install -e ".[dev,paper]"

      - name: Run test suite
        run: python -m pytest tests -q

  evidence:
    name: public evidence reproduces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev,paper]"

      # Each step recomputes a published number from the released arrays and
      # fails if the committed artifact disagrees.
      - name: Brier table, clustered intervals, 847 candidate selection audit
        run: python tools/reproduce_public_evidence.py --check

      - name: Release contains no secrets or private paths
        run: python tools/audit_public_release.py

      - name: Claim register is current
        run: python tools/build_publication_claims.py --check

      - name: Paper matches its manuscript and claim register
        run: python tools/build_public_paper.py --check
