name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes an in flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The three versions pyproject.toml claims to support.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Playwright is a core dependency because chainlink_recorder.public_delayed
      # imports it at module level. No test launches a browser, so the Chromium
      # binary is deliberately not downloaded here.
      - name: Install
        run: python -m pip install -e ".[dev,paper]"

      # The failing test names are echoed as a job annotation, which stays
      # readable without repository admin rights.
      - name: Run test suite
        run: |
          if out=$(python -m pytest tests -q 2>&1); then
            echo "$out"
          else
            echo "$out"
            summary=$(echo "$out" | grep -E '^(FAILED|ERROR)' | head -5 | tr '\n' ' ')
            echo "::error title=pytest ${{ matrix.python-version }}::${summary:-see log}"
            exit 1
          fi

  evidence:
    name: public evidence reproduces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev,paper]"

      # Every check runs even when an earlier one fails, so a single run reports
      # all the damage instead of one problem per push. Each failure is emitted
      # as an annotation carrying the tool's own diagnostic.
      - name: Recompute every published number
        run: |
          failed=0
          check () {
            local title="$1"; shift
            echo "::group::${title}"
            if out=$(python "$@" 2>&1); then
              echo "$out"
              echo "::endgroup::"
            else
              echo "$out"
              echo "::endgroup::"
              echo "::error title=${title}::$(echo "$out" | tail -4 | tr '\n' ' ')"
              failed=1
            fi
          }
          check "Brier table and 847 candidate selection audit" tools/reproduce_public_evidence.py --check
          check "Release contains no secrets or private paths" tools/audit_public_release.py
          check "Claim register is current" tools/build_publication_claims.py --check
          check "Paper matches its manuscript and claim register" tools/build_public_paper.py --check
          exit $failed
