  model_08c_maker_defense_v3:
    display_name: Maker-defense v3 (event-time microstructure)
    model_id: model_08c_maker_defense_v3
    phase: 8
    status: baseline_trained
    training_completed: '2026-05-12'
    training_data_window: '2026-04-19..2026-05-06'
    dataset_source: microstructure_sequence_dataset_v1_event64
    gate_result: PASS
    gate_note: >
      Upgrades v1 with 61 event-time features extracted from per-anchor L2
      event lists (sub-millisecond granularity, 64 events per anchor).  On the
      critical extreme_10c_5s detector: AUC 0.87->0.90, FPR@95%recall 0.46->0.36
      (-9.7pp), FPR@99%recall 0.68->0.61 (-6.5pp).  Event-time alone is weaker
      than aggregates alone, but agg+event-time combined wins decisively
      across all three targets.  SUPERSEDES v1 as the deployed maker defense.
    purpose: Sub-millisecond event-time detection of dramatic moves for maker withdrawal
    roadmap_section: XIV Model 8 (operational extension v3)
    supersedes: model_08c_maker_defense
    sub_models:
      extreme_10c_5s_v3:
        target: '|mid_move_5s| >= 0.10'
        pos_rate_test: 0.0143
        auc_test: 0.9009
        ap_test: 0.2167
        operating_points:
          hard_stop_99pct_recall:
            threshold: 0.00167
            recall: 0.99
            fpr: 0.6107
          hard_stop_95pct_recall:
            threshold: 0.00423
            recall: 0.95
            fpr: 0.3615
            description: recommended default; catches 95% of 10c+ jumps, defensive 37% of time
          hard_stop_90pct_recall:
            threshold: 0.00648
            recall: 0.90
            fpr: 0.2775
      severe_7c_3s_v3:
        target: '|mid_move_3s| >= 0.07'
        pos_rate_test: 0.0479
        auc_test: 0.8313
        ap_test: 0.2660
