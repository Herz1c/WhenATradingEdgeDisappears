version: 1
last_updated: '2026-05-12'
models:
  model_01_bias:
    display_name: 5-minute interval bias model
    model_id: model_01_bias
    phase: 4
    status: baseline_trained
    training_completed: '2026-05-08'
    training_data_window: '2026-04-19..2026-05-06'
    training_split: 'train=2026-04-19..2026-05-04 (16d) | val=2026-05-05 | test=2026-05-06'
    gate_result: AUDIT_FAIL_2026-05-12
    gate_note: |
      ORIGINAL: beats delta_to_strike_heuristic on val+test; PASS.
      AUDIT (2026-05-12): the previous gate baseline was a strawman
      `sigmoid(delta * 0.5)` whose log_loss=1.35.  Replaced with properly
      fitted delta_to_strike LR baseline (log_loss=0.651 on test).
      Honest verdict per variant on test day:
        preopen  LR/LGBM: FAIL  (loses to constant baseline)
        first15s LR/LGBM: FAIL  (loses to constant baseline)
        first30s LR/LGBM: BEATS constant but LOSES to delta_LR_baseline.
      No Model 01 variant adds signal beyond delta-to-strike.
      Recommendation: defer to Models 02/05 (much larger row counts,
      both pass honest gate) until training window reaches ~60 days.
    purpose: Prior probability for interval direction before market opens
    roadmap_section: XIV Model 1
    dataset:
      family: market_interval_dataset
      version: v1
      variants:
      - preopen
      - first15s
      - first30s
      paths:
        preopen: data/datasets/market_interval_dataset_v1_preopen/
        first15s: data/datasets/market_interval_dataset_v1_first15s/
        first30s: data/datasets/market_interval_dataset_v1_first30s/
      schema_contract: config/schemas/market_interval_dataset_v1_schema.yaml
      dataset_hash_required: true
    feature_set:
      version: v1
      config: config/feature_sets/model_01_bias_features_v1.yaml
    target:
      primary: resolved_side_label
      auxiliary:
      - early_direction_sign
      - first_30s_drift_sign
      leakage_only_cols:
      - resolved_side
      - resolved_side_label
      - flip_happened_after_t
      - terminal_delta_to_strike
      - terminal_margin_to_strike
      - hold_to_close_edge_vs_mid
      - resolved_ts_ns
      - winning_asset_id
    split:
      method: anchored_walkforward
      config: config/splits/model_01_bias_split_v1.yaml
      unit: market
      ordering_col: market_open_ts_ns
      purge_days: 1
      embargo_days: 0
    algorithms:
      baseline: logistic_regression
      primary: lightgbm
    evaluation:
      metrics:
      - log_loss
      - brier_score
      - ece
      - fee_adjusted_edge
      - calibration_curve
      gate: must_beat_delta_to_strike_heuristic
    artifacts:
      base_path: artifacts/model_01_bias/
      model_file: model.pkl
      eval_report: eval_report.md
      experiment_log: experiment_log.jsonl
      calibration_file: calibration.pkl
      feature_importance: feature_importance.json
