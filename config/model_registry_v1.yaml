      Three asymmetric-cost classifiers for hybrid maker/taker bot.  PRIMARY
      extreme_10c_5s (|mid_move_5s|>=0.10): AUC=0.87, 10.2x lift, 99% recall
      achievable at 62% FPR.  Detects catastrophic 10c+ jumps that would cause
      adverse fills on resting maker orders.  Designed for "miss = catastrophe,
      false alarm = cheap" decision regime.
    purpose: Early-warning detection of dramatic moves for maker order withdrawal
    roadmap_section: XIV Model 8 (operational extension)
    sub_models:
      extreme_10c_5s:
        target: '|mid_move_5s| >= 0.10'
