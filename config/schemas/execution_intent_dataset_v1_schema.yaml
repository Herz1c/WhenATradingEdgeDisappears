version: execution_intent_dataset_v1
description: Phase 6 execution intent dataset. One row is one deterministic maker-first
  quote/action opportunity generated by execution_simulator_v1. Outcome columns are
  leakage_only and must not be used as decision-time features.
forbidden_columns:
- flip_happened_after_t
- hold_to_close_edge_vs_mid
- max_adverse_excursion_15s
- max_adverse_excursion_5s
- max_favorable_excursion_15s
- max_favorable_excursion_5s
- mid_move_15s
- mid_move_1s
- mid_move_30s
- mid_move_3s
- mid_move_5s
- mid_move_sign_15s
- mid_move_sign_1s
- mid_move_sign_30s
- mid_move_sign_3s
- mid_move_sign_5s
- terminal_margin_to_strike
