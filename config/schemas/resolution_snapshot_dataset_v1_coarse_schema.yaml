    dtype: bool
    nullable: false
    leakage_only: false
    training_eligible: false
    source: phase3_contract
    description: True when either token book is crossed or locked under the strict
      >= rule.
  up_token_mid_complete:
    dtype: bool
    nullable: false
    leakage_only: false
    training_eligible: false
    source: polymarket_l2
    description: True when the UP token has both best bid and best ask and therefore
      a valid mid.
  down_token_mid_complete:
    dtype: bool
    nullable: false
    leakage_only: false
    training_eligible: false
    source: polymarket_l2
    description: True when the DOWN token has both best bid and best ask and therefore
      a valid mid.
  token_mid_complete:
    dtype: bool
    nullable: false
    leakage_only: false
    training_eligible: false
    source: phase3_contract
    description: True when both UP and DOWN token mids are available.
  up_token_one_sided_book:
    dtype: bool
    nullable: false
    leakage_only: false
    training_eligible: false
    source: polymarket_l2
    description: True when exactly one of UP best bid / best ask is available.
  down_token_one_sided_book:
    dtype: bool
    nullable: false
    leakage_only: false
    training_eligible: false
    source: polymarket_l2
    description: True when exactly one of DOWN best bid / best ask is available.
  one_sided_book:
    dtype: bool
    nullable: false
    leakage_only: false
    training_eligible: false
    source: phase3_contract
    description: True when either token has a one-sided top of book.
