dataset_name: microstructure_sequence_dataset_v1
notes:
- sequence_length_actual is int16 because event128 cannot be represented by signed
  int8.
- Target columns are labels only and must remain leakage_only=true.
- tabular stores only aggregated tabular columns; event64/event128 store tabular columns
  plus sequence arrays.
- events_event_type uses pad as an explicit padding sentinel for prepended padding
  positions.
columns:
  sequence_id:
    dtype: string
    nullable: false
    leakage_only: false
    training_eligible: false
    source: derived_quality
    description: Stable sample identifier shared across tabular, event64, and event128
      variants for the same market_slug, token_asset_id, anchor_ts_ns, and anchor_source.
  market_slug:
    dtype: string
    nullable: false
    leakage_only: false
    training_eligible: false
    source: derived_identity
    description: Phase 8 microstructure sequence dataset column `market_slug`.
